{% extends "base.html" %}
{% block title %}Edit playlist - BragiServer{% endblock %}
{% block content %}
<section class="panel">
<p class="eyebrow">Library</p>
<h1>{{ "Edit" if playlist_id else "Create" }} playlist</h1>
<p class="muted">Owner: {{ owner }}</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="owner" value="{{ owner }}">
  <label for="name">Playlist name</label>
  <input id="name" name="name" type="text" maxlength="200" value="{{ playlist.name }}" required>
  <p class="help">Manage tracks in a playback client.</p>
  <div class="actions">
    <button class="primary" type="submit">Save playlist</button>
    <a class="button" href="{{ url_for('management.playlists', owner=owner) }}">Cancel</a>
  </div>
</form>
</section>
{% endblock %}
